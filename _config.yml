# Desert Springs Civil Engineering PLLC
# Site Settings
locale                   : "en-US"
title                    : "Desert Springs Civil Engineering"
title_separator          : "—"
subtitle                 : "Civil Engineering. Personal Service."
name                     : "Desert Springs Civil Engineering PLLC"
description              : "Civil and water engineering in Meridian, Idaho. 14+ years experience, direct access to your engineer, and home of Saikei Civil open-source infrastructure tools."
url                      : "https://desertspringscivil.com"
baseurl                  : ""
repository               : "desertspringscivil/desertspringscivil.github.io"
teaser                   : # path of fallback teaser image
logo                     : "/assets/images/logo.svg"
masthead_title           : "Desert Springs Civil"

# Site Author
author:
  name             : "Michael Yoder, PE"
  avatar           : # path of avatar image
  bio              : "Founder & Principal Engineer"
  location         : "Meridian, Idaho"
  email            : "myoder@desertspringscivil.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/company/saikeicivil"
    - label: "Saikei Civil"
      icon: "fas fa-fw fa-road"
      url: "https://saikeicivil.org"

# Site Footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/company/saikeicivil"
    - label: "Saikei Civil"
      icon: "fas fa-fw fa-road"
      url: "https://saikeicivil.org"

# Reading Files
include:
  - _pages

# Build settings
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Defaults
defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
