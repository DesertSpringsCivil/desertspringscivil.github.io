<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="civilBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8f4"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="civilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  <rect fill="url(#civilBg)" width="400" height="300"/>

  <!-- Survey/grading icon - stylized contour lines -->
  <g transform="translate(200, 115)">
    <!-- Outer contour -->
    <ellipse cx="0" cy="0" rx="70" ry="35" fill="none" stroke="#c8e6c9" stroke-width="2"/>
    <!-- Middle contour -->
    <ellipse cx="0" cy="-8" rx="50" ry="25" fill="none" stroke="#a5d6a7" stroke-width="2"/>
    <!-- Inner contour -->
    <ellipse cx="0" cy="-16" rx="30" ry="15" fill="none" stroke="#81c784" stroke-width="2"/>
    <!-- Peak marker -->
    <circle cx="0" cy="-20" r="8" fill="url(#civilGrad)"/>
    <line x1="0" y1="-28" x2="0" y2="-45" stroke="#2e7d32" stroke-width="2"/>
    <polygon points="0,-50 -5,-42 5,-42" fill="#2e7d32"/>
  </g>

  <!-- Grade stakes -->
  <g transform="translate(120, 170)">
    <rect x="-3" y="0" width="6" height="30" fill="#388e3c"/>
    <rect x="-8" y="0" width="16" height="4" fill="#2e7d32"/>
  </g>
  <g transform="translate(280, 170)">
    <rect x="-3" y="0" width="6" height="30" fill="#388e3c"/>
    <rect x="-8" y="0" width="16" height="4" fill="#2e7d32"/>
  </g>

  <!-- Ground line -->
  <line x1="80" y1="200" x2="320" y2="200" stroke="#1b5e20" stroke-width="2" stroke-dasharray="8,4"/>

  <text x="200" y="265" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b5e20">Civil Design</text>
</svg>
