<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8f4"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>
  <rect fill="url(#waterBg)" width="400" height="300"/>

  <!-- Water drop icon -->
  <g transform="translate(200, 120)">
    <path d="M0,-60 C30,-30 45,15 45,35 C45,60 25,75 0,75 C-25,75 -45,60 -45,35 C-45,15 -30,-30 0,-60 Z"
          fill="url(#waterGrad)" opacity="0.9"/>
    <ellipse cx="0" cy="40" rx="25" ry="10" fill="#81c784" opacity="0.4"/>
    <path d="M-15,-15 Q-5,-25 5,-15" stroke="#fff" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- Subtle wave lines -->
  <path d="M50,200 Q100,185 150,200 T250,200 T350,200" stroke="#a5d6a7" stroke-width="2" fill="none"/>
  <path d="M50,215 Q100,200 150,215 T250,215 T350,215" stroke="#c8e6c9" stroke-width="2" fill="none"/>

  <text x="200" y="265" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b5e20">Water Engineering</text>
</svg>
