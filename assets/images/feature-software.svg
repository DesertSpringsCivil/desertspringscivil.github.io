<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8f4"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#0d3d0f"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
  </defs>
  <rect fill="url(#softBg)" width="400" height="300"/>

  <!-- Monitor frame -->
  <rect x="95" y="55" width="210" height="140" rx="8" fill="url(#frameGrad)"/>
  <!-- Screen -->
  <rect x="105" y="65" width="190" height="115" rx="4" fill="url(#screenGrad)"/>

  <!-- Code lines on screen -->
  <g opacity="0.9">
    <rect x="115" y="80" width="60" height="3" rx="1" fill="#4caf50"/>
    <rect x="115" y="90" width="100" height="3" rx="1" fill="#81c784"/>
    <rect x="125" y="100" width="80" height="3" rx="1" fill="#a5d6a7"/>
    <rect x="125" y="110" width="55" height="3" rx="1" fill="#81c784"/>
    <rect x="115" y="120" width="90" height="3" rx="1" fill="#4caf50"/>
    <rect x="115" y="130" width="40" height="3" rx="1" fill="#a5d6a7"/>
    <rect x="115" y="140" width="70" height="3" rx="1" fill="#81c784"/>
    <rect x="115" y="150" width="50" height="3" rx="1" fill="#4caf50"/>
    <rect x="115" y="160" width="85" height="3" rx="1" fill="#a5d6a7"/>
  </g>

  <!-- Cursor blink -->
  <rect x="205" y="160" width="2" height="10" fill="#4caf50" opacity="0.8"/>

  <!-- Monitor stand -->
  <rect x="175" y="195" width="50" height="8" rx="2" fill="#388e3c"/>
  <rect x="160" y="203" width="80" height="6" rx="3" fill="#2e7d32"/>

  <text x="200" y="265" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b5e20">Software Development</text>
</svg>
